[package]
name = "hidbridge"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", default-features = false }
serde_json = "1"
keymap = { path = "../keymap" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
