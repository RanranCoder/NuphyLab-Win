[package]
name = "shell"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "NuPhyLab"
path = "src/main.rs"

[build-dependencies]
# Embeds AppIcon.ico and a VERSIONINFO block into NuPhyLab.exe (windres on the
# GNU toolchain). Without it Explorer shows the generic icon.
winresource = "0.1"
serde_json = "1"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
keymap = { path = "../keymap" }
tao = "0.31"
# "devtools" keeps the F12 inspector available in release builds behind the
# AIR_STUDIO_DEVTOOLS env gate (field diagnostics).
wry = { version = "0.47", features = ["devtools"] }
tray-icon = "0.20"
png = "0.17"
url = "2"
rustfft = "6"
num-complex = "0.4"
wasapi = "0.15"
ureq = { version = "2", default-features = false }
# COM wrappers for DXGI Desktop Duplication (windows-sys 0.59 dropped the
# D3D/DXGI feature modules); everything else stays on windows-sys.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
] }
# Flat unsafe bindings: predictable signatures for Job Objects, ShellExecuteW,
# MessageBoxW and screen metrics on the GNU toolchain.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
